name: Generate ASCII Profile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/portrait.png'
      - 'scripts/generate_profile.py'
      - '.github/workflows/generate-ascii.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/generate_profile.py
      - name: Commit generated SVGs
        run: |
          if [[ -n "$(git status --porcelain -- assets/dark_mode.svg assets/light_mode.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/dark_mode.svg assets/light_mode.svg
            git commit -m "chore: regenerate ASCII profile SVGs"
            git push
          fi
